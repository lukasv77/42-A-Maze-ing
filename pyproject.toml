[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "Reusable random maze generator (42 A-Maze-ing project)"
requires-python = ">=3.10"

[tool.setuptools]
py-modules = ["mazegen"]

[tool.mypy]
exclude = ["venv", "build"]
